# Author: Amin Shahamiri
# Docker Compose file to set up a Node.js API with Nginx as a reverse proxy and Fail2Ban for security
services:
  api:
    build: .
    container_name: node-api
    environment:
      APP_PORT: 3000
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./jail.local:/etc/fail2ban/jail.local:ro
      - ./fail2ban/filter.d:/etc/fail2ban/filter.d:ro
      - ./logs:/var/log/nginx:ro
    depends_on:
      - nginx
    restart: unless-stopped